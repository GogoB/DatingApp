<div class="card bg-base-100 w-1/2 mx-auto p-10 mt-10 shadow-xl">
<h1>{{title}}</h1>
<h3 class="text-3xl text-red-500">Hi there</h3>
<ul class="list">
<!--or for track you can use the member id-->
  @for(member of members(); track member.id){
    <li class="list-row items-center">{{member.id}} -- {{member.displayName}}</li>
    <img src="/user.png" alt="user avatar" class="size-12 rounded-box">
    <div>
      {{member.displayName}}
    </div>
  }
  <button class="btn btn-xs sm:btn-sm md:btn-md lg:btn-lg xl:btn-xl">Responsive</button>
</ul>
</div>
